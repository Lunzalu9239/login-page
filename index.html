<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAT Marks Submission</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #fff;
      color: #1c1e21;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .form-wrap {
      width: min(446px, calc(100% - 48px));
      margin-top: 28px;
    }

    .heading {
      font-size: 16px;
      margin: 0 0 25px;
      font-weight: 400;
    }

    input {
      display: block;
      width: 100%;
      height: 60px;
      border: 1px solid #d5d8dc;
      border-radius: 16px;
      padding: 0 17px;
      margin-bottom: 12px;
      font-size: 15px;
      color: #1c1e21;
      outline: none;
      background: #fff;
    }

    input:focus {
      border-color: #1877f2;
    }

    input::placeholder {
      color: #606770;
      opacity: 1;
    }

    .login {
      width: 100%;
      height: 45px;
      margin-top: 12px;
      border: 1px solid #0866ff;
      border-radius: 24px;
      background: #0866e9;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }

    #status {
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <main class="form-wrap">

    <p class="heading">CAT Marks Submission</p>

    <form id="marksForm">

      <input
        type="email"
        name="email"
        placeholder="Email address"
        autocomplete="email"
        required
      >

      <input
        type="text"
        name="marks"
        placeholder="Marks"
        maxlength="100"
        required
      >

      <button class="login" type="submit">
        Submit
      </button>

    </form>

    <p id="status"></p>

  </main>

  <script>
    const form = document.getElementById("marksForm");
    const status = document.getElementById("status");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      status.textContent = "Submitting...";

      const email = form.email.value.trim();
      const marks = form.marks.value.trim();

      try {
        const response = await fetch(
          "/.netlify/functions/submit-marks",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              email: email,
              marks: marks
            })
          }
        );

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || "Submission failed");
        }

        status.textContent = "CAT marks submitted successfully.";
        form.reset();

      } catch (error) {
        console.error(error);
        status.textContent =
          "Submission failed. Please try again.";
      }
    });
  </script>

</body>
</html>
